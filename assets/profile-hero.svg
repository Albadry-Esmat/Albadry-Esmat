        <text x="98" y="39" text-anchor="middle" fill="#FFFFFF" font-size="22">AI Engineering</text>
        <text x="98" y="64" text-anchor="middle" fill="#C4B5FD" font-size="14" font-weight="500">Agents & governance</text>
