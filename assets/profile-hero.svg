<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">Albadry Esmat — Dynamics 365, Power Platform, AI Engineering, Azure and .NET</title>
  <desc id="desc">A dark technology banner with architecture nodes representing Dynamics 365, Dataverse, Azure, AI and .NET.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061525"/>
      <stop offset="52%" stop-color="#0B2742"/>
      <stop offset="100%" stop-color="#071A2E"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="75%" cy="44%" r="48%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="84%" cy="68%" r="42%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="48%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="460" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="460" rx="30" fill="url(#glowBlue)"/>
  <rect width="1600" height="460" rx="30" fill="url(#glowTeal)"/>

  <g opacity="0.18" stroke="#8FD8FF" stroke-width="1">
